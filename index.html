<meta charset="utf-8">
<title>Nordweg — documento protegido</title>
<style>
  :root{
    --bg:#FBFAF7; --panel:#F3F1EA; --ink:#211E19; --muted:#6B665B; --line:#E2DDD1;
    --accent:#8A5A28; --accent-ink:#FFFFFF; --crit:#A03B2A; --crit-bg:#F6E6E1;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }
  :root{color-scheme:light}
  html{background:var(--bg)}
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased}
  .gate{width:min(24rem, 92vw); border:1px solid var(--line); border-radius:10px; background:var(--panel);
    padding:2rem 1.8rem 1.8rem; margin:2rem 1rem}
  .eyebrow{font-family:var(--mono); font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin:0 0 .7rem}
  h1{font-family:var(--serif); font-weight:600; font-size:1.45rem; line-height:1.2; margin:0 0 .5rem}
  p{color:var(--muted); font-size:.9rem; line-height:1.5; margin:.3rem 0 1.2rem}
  form{display:flex; gap:.55rem}
  input{flex:1; font:inherit; font-size:.95rem; padding:.6rem .8rem; border:1px solid var(--line);
    border-radius:6px; background:var(--bg); color:var(--ink); min-width:0}
  input:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  button{font:inherit; font-size:.9rem; font-weight:650; padding:.6rem 1.05rem; border:0; border-radius:6px;
    background:var(--accent); color:var(--accent-ink); cursor:pointer}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  button[disabled]{opacity:.6; cursor:wait}
  .err{display:none; margin:.9rem 0 0; padding:.55rem .8rem; border-radius:6px; font-size:.85rem;
    color:var(--crit); background:var(--crit-bg)}
  .err.show{display:block}
</style>
<div class="gate">
  <p class="eyebrow">Nordweg · confidencial</p>
  <h1>Plano tributário EUA–Brasil</h1>
  <p>Este documento é protegido. Digite a senha para abrir — o conteúdo é descriptografado só no seu navegador.</p>
  <form id="f">
    <input id="pw" type="password" placeholder="Senha" autocomplete="off" autofocus aria-label="Senha">
    <button id="go" type="submit">Abrir</button>
  </form>
  <p class="err" id="err">Senha incorreta — tente de novo.</p>
</div>
